[pytest]
markers =
    live: tests that require external live services (OpenClaw gateway, tailnet workspace API, or similar)
    hermetic: fully local unit/integration tests with no external network dependency
# Default local guidance:
#   hermetic: pytest -m "not live"
#   live-only: pytest -m live
# Keep addopts empty so release/aperture gates can parse the "N passed" summary line.
filterwarnings =
    ignore::DeprecationWarning
